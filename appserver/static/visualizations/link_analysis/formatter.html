<form class="splunk-formatter-section" section-label="Vizualization Style">
    <splunk-control-group label="Layout Style">
        <splunk-select name="{{VIZ_NAMESPACE}}.layoutStyle" value="fcose">
            <option value="fcose">fcose</option>
            <option value="grid">grid</option>
            <option value="circle">circle</option>
            <option value="klay">klay</option>
            <option value="dagre">dagre</option>
            <option value="concentric">concentric</option>
            <option value="breadthfirst">breadthfirst</option>
            <option value="cose">cose</option>
            <option value="cose-bilkent">cose-bilkent</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Path Selection Algorithm">
        <splunk-select name="{{VIZ_NAMESPACE}}.pathAlgo" value="dijkstra">
            <option value="dijkstra">dijkstra</option>
            <option value="aStar">aStar</option>
            <option value="floydWarshall">floydWarshall</option>
            <option value="bellmanFord">bellmanFord</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Path Selection Directed">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.directed" value="false">
            <option value="false">false</option>
            <option value="true">true</option>
        </splunk-radio-input>
    </splunk-control-group>
    <splunk-control-group label="Recursive Graph Addition">
        <splunk-radio-input name="{{VIZ_NAMESPACE}}.recursiveLookup" value="false">
            <option value="false">false</option>
            <option value="true">true</option>
        </splunk-radio-input>
    </splunk-control-group>


    <splunk-control-group label="Maximum rows (1-50000)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.maxRows" value="10000">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Node size">
        <splunk-select name="{{VIZ_NAMESPACE}}.nodeSize" value="fixed">
            <option value="fixed">Fixed</option>
            <option value="degree">By number of connections</option>
            <option value="count">By total count</option>
            <option value="pagerank">By PageRank</option>
            <option value="betweenness">By betweenness</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Large graph threshold (nodes)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.largeGraphNodes" value="2000">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Edge width">
        <splunk-select name="{{VIZ_NAMESPACE}}.edgeWidth" value="fixed">
            <option value="fixed">Fixed</option>
            <option value="count">By count</option>
        </splunk-select>
    </splunk-control-group>
    <splunk-control-group label="Renderer">
        <splunk-select name="{{VIZ_NAMESPACE}}.renderer" value="canvas">
            <option value="canvas">Canvas</option>
            <option value="webgl">WebGL (experimental)</option>
        </splunk-select>
    </splunk-control-group>
</form>
<form class="splunk-formatter-section" section-label="Expand Nodes">
    <splunk-control-group label="Expand base search (node name is added as a quoted term)" help="e.g. index=firewall sourcetype=fw">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.expandBase" value="">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Expand stats (must output source, target, count)">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.expandStats" value="| stats count by src_ip dest_ip">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Expand earliest time">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.expandEarliest" value="-24h@h">
        </splunk-text-input>
    </splunk-control-group>
    <splunk-control-group label="Expand latest time">
        <splunk-text-input name="{{VIZ_NAMESPACE}}.expandLatest" value="now">
        </splunk-text-input>
    </splunk-control-group>
</form>
