#
# Declare shared visualizations
#

[link_analysis]
label = Licoryx Link Analysis (Classic)
description = Visualize relationships between objects with this visualization framework.
search_fragment = yoursearch | table src_ip, dest_ip, count
default_height = 600
supports_drilldown = true

[link_analysis_studio]
label = Licoryx Link Analysis
description = Dashboard Studio version of the Link Analysis visualization. Visualize relationships between objects, and load graphs saved with Save State.
search_fragment = yoursearch | table src_ip, dest_ip, count
default_height = 600
supports_drilldown = true
framework_type = studio_visualization
# Studio-framework visualizations only run inside Dashboard Studio: keep it out of the
# search page / Simple XML visualization picker, where it would fail to load.
allow_user_selection = false
