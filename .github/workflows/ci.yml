name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, package and AppInspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, unit test and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Committed bundles match the source
        run: git diff --exit-code --stat -- appserver/static

      - name: Package app
        run: ./package.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: AppInspect (Splunk Cloud checks)
        run: |
          pip install --quiet splunk-appinspect
          PKG=$(ls dist/licoryx_link_analysis_app-*.tgz | sort -V | tail -1)
          splunk-appinspect inspect "$PKG" --mode precert --included-tags cloud \
            --output-file appinspect.json --data-format json
          python3 - <<'PY'
          import json, sys
          d = json.load(open('appinspect.json'))
          s = d['summary']
          print({k: s.get(k) for k in ('error', 'failure', 'future_failure', 'warning', 'success')})
          for r in d['reports']:
              for g in r['groups']:
                  for c in g['checks']:
                      if c['result'] in ('error', 'failure', 'warning', 'future_failure'):
                          print(c['result'].upper(), c['name'])
          sys.exit(1 if s.get('error') or s.get('failure') else 0)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: app-package
          path: |
            dist/licoryx_link_analysis_app-*.tgz
            appinspect.json

  smoke:
    name: Smoke test on Splunk ${{ matrix.splunk }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - splunk: "10.6.2"
            skip_studio: "0"
          - splunk: "10.4"
            skip_studio: "0"
          - splunk: "9.4"
            skip_studio: "1"
    env:
      SPLUNK_PASSWORD: ci-Passw0rd-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: app-package
          path: artifact

      - name: Start Splunk ${{ matrix.splunk }} with the app
        run: |
          PKG=$(ls artifact/dist/licoryx_link_analysis_app-*.tgz | sort -V | tail -1)
          cp "$PKG" /tmp/app.tgz
          docker run -d --name splunk -p 8000:8000 -p 8089:8089 \
            -e SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com \
            -e SPLUNK_START_ARGS=--accept-license \
            -e SPLUNK_PASSWORD="$SPLUNK_PASSWORD" \
            -e SPLUNK_APPS_URL=/tmp/app.tgz \
            -v /tmp/app.tgz:/tmp/app.tgz \
            splunk/splunk:${{ matrix.splunk }}
          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' splunk)
            echo "health: $status"
            [ "$status" = healthy ] && break
            sleep 10
          done
          if [ "$status" != healthy ]; then docker logs splunk | tail -50; exit 1; fi

      - name: Wait for the KV store
        run: |
          # Save State uses the KV store; on a fresh container it can take a while to start.
          for i in $(seq 1 60); do
            kv=$(curl -sk -u "admin:$SPLUNK_PASSWORD" "https://localhost:8089/services/kvstore/status?output_mode=json" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['entry'][0]['content']['current']['status'])" 2>/dev/null || echo unknown)
            echo "kvstore: $kv"
            [ "$kv" = ready ] && exit 0
            sleep 10
          done
          docker exec -u root splunk sh -c 'tail -60 /opt/splunk/var/log/splunk/mongod.log; grep -i kvstore /opt/splunk/var/log/splunk/splunkd.log | tail -30' > kvstore.log 2>&1 || true
          cat kvstore.log
          # Splunk's bundled MongoDB refuses to start on Linux kernel 6.19+ (MongoDB SERVER-121912).
          # That is a host/Splunk limitation, not an app problem: run every other check and skip
          # only the KV-store checks. Any other KV store failure still fails the job.
          if grep -q 'SERVER-121912' kvstore.log; then
            echo "::warning::Splunk's KV store cannot start on this runner's kernel ($(uname -r)); see MongoDB SERVER-121912. KV-store checks are skipped."
            echo "SKIP_KVSTORE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::KV store did not become ready"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: tests
        env:
          SKIP_STUDIO: ${{ matrix.skip_studio }}
        run: node smoke.mjs screenshots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots-${{ matrix.splunk }}
          path: tests/screenshots
