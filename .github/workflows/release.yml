name: Release

# Publish a GitHub Release with the Splunk app package attached, either by
#  - pushing a tag like v2.3.0 (matching the version in default/app.conf), or
#  - running this workflow manually (Actions > Release > Run workflow) with the version;
#    the tag is then created on the selected branch's commit.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match default/app.conf), e.g. 2.3.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tag matches app version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(sed -n 's/^version *= *//p' default/app.conf | head -1)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="v${INPUT_VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          echo "app.conf version: $VERSION, tag: $TAG"
          [ "v$VERSION" = "$TAG" ] || { echo "::error::Tag $TAG does not match app.conf version $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install, unit test and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Committed bundles match the source
        run: git diff --exit-code --stat -- appserver/static

      - name: Package app
        run: |
          ./package.sh
          ./package-studio-only.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: AppInspect (Splunk Cloud checks)
        run: |
          pip install --quiet splunk-appinspect
          for f in "" "-studio-only"; do
            splunk-appinspect inspect "dist/licoryx_link_analysis_app-$VERSION$f.tgz" --mode precert --included-tags cloud \
              --output-file "appinspect$f.json" --data-format json
            python3 - "appinspect$f.json" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))['summary']
          print(sys.argv[1], s)
          sys.exit(1 if s.get('error') or s.get('failure') else 0)
          PY
          done

      - name: Release notes from README
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ['VERSION']
          text = open('README.md', encoding='utf-8').read()
          m = re.search(r'^#### ' + re.escape(version) + r'\s*\n(.*?)(?=^#### |^### |\Z)', text, re.S | re.M)
          notes = m.group(1).strip() if m else f'Licoryx Link Analysis App {version}.'
          notes += '\n\nInstall `licoryx_link_analysis_app-' + version + '.tgz` via Apps > Manage Apps > Install app from file.'
          notes += ' For a Dashboard Studio-only install (no Classic visualization, Save State, Expand, exports or Manage page) use `licoryx_link_analysis_app-' + version + '-studio-only.tgz` instead.'
          open('release-notes.md', 'w', encoding='utf-8').write(notes + '\n')
          print(notes)
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TARGET="--target $GITHUB_SHA"; else TARGET="--verify-tag"; fi
          gh release create "$TAG" "dist/licoryx_link_analysis_app-$VERSION.tgz" appinspect.json \
            "dist/licoryx_link_analysis_app-$VERSION-studio-only.tgz" appinspect-studio-only.json \
            --title "Licoryx Link Analysis App $VERSION" --notes-file release-notes.md $TARGET
